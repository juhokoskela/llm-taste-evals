# Egress proxy for eval runs: HTTPS CONNECT to allowlisted domains only.
# The runner container's only route out is through this proxy, so this file
# is the complete statement of what an agent can reach.
http_port 3128
visible_hostname egress

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT
acl allowed dstdomain "/etc/squid/allowlist.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# No caching; this is purely an egress gate.
cache deny all
# stdout is not writable by squid's privilege-dropped user; read the audit
# trail with: docker compose exec egress tail /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log
